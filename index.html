<!-- (0.9) rede de segurança: se a casca não conseguiu montar a página (logo depois de uma atualização do
     site o navegador pode misturar arquivos novos com cópias antigas, ou um arquivo pode ter vindo com erro),
     aparece um aviso com "Recarregar" em vez de uma tela vazia. -->
<script>
(function () {
  var TXT = {
    pt: ['O Workspace não abriu direito', 'Isso costuma acontecer logo depois de uma atualização do site, quando o navegador ainda guarda parte dos arquivos antigos. Recarregar resolve quase sempre.', 'Recarregar', 'Relatar um problema'],
    en: ['The Workspace didn’t open properly', 'This usually happens right after a site update, when the browser still keeps part of the old files. Reloading almost always fixes it.', 'Reload', 'Report a problem'],
    es: ['El Workspace no se abrió bien', 'Esto suele pasar justo después de una actualización del sitio, cuando el navegador todavía guarda parte de los archivos antiguos. Recargar casi siempre lo resuelve.', 'Recargar', 'Informar un problema']
  };
  function recarregar(b) {
    b.disabled = true;
    // busca de novo, direto do site, a página e cada arquivo dela (cache: 'reload' troca a cópia que o navegador
    // guardou), apaga a cópia para uso sem internet e pede ao navegador a versão nova do sw.js; depois recarrega
    var urls = [location.href.split('#')[0]], passos = [];
    [].forEach.call(document.querySelectorAll('script[src],link[rel="stylesheet"][href]'), function (el) {
      var u = el.src || el.href;
      if (u && u.indexOf(location.origin) === 0) urls.push(u);
    });
    urls.forEach(function (u) { try { passos.push(fetch(u, { cache: 'reload' }).catch(function () {})); } catch (e) { /* ignora */ } });
    try { if (window.caches) passos.push(caches.keys().then(function (k) { return Promise.all(k.filter(function (n) { return n.indexOf('nebulosa-site-') === 0; }).map(function (n) { return caches.delete(n); })); })); } catch (e) { /* ignora */ }
    try { if (navigator.serviceWorker) passos.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.update().catch(function () {}); })); })); } catch (e) { /* ignora */ }
    var feito = false, ir = function () { if (!feito) { feito = true; location.reload(); } };
    Promise.all(passos).then(ir, ir);
    setTimeout(ir, 6000);
  }
  function aviso() {
    var rail = document.getElementById('rail');
    if ((rail && rail.children.length) || document.getElementById('nbFalha')) return;
    var l = ''; try { l = localStorage.getItem('nebulosa.idioma') || ''; } catch (e) { /* ignora */ }
    var X = TXT[(l || navigator.language || 'pt').slice(0, 2).toLowerCase()] || TXT.pt;
    var d = document.createElement('div');
    d.id = 'nbFalha'; d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:20px;background:rgba(10,11,28,.55);font-family:Figtree,system-ui,sans-serif';
    d.innerHTML = '<div style="max-width:440px;background:#24264a;color:#f3f1ff;border:1px solid rgba(167,120,255,.45);border-radius:16px;padding:24px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45)">' +
      '<h2 style="margin:0 0 10px;font-size:20px"></h2><p style="margin:0 0 18px;line-height:1.5;opacity:.9"></p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" data-a="r" style="font:inherit;font-weight:600;padding:9px 16px;border-radius:10px;border:0;background:#A778FF;color:#1b1c33;cursor:pointer"></button>' +
      '<a data-a="m" style="font:inherit;padding:9px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.25);color:inherit;text-decoration:none"></a></div></div>';
    d.querySelector('h2').textContent = X[0]; d.querySelector('p').textContent = X[1];
    var b = d.querySelector('[data-a="r"]'); b.textContent = X[2]; b.onclick = function () { recarregar(b); };
    var m = d.querySelector('[data-a="m"]'); m.textContent = X[3];
    m.href = 'mailto:nebulosaworkspace@gmail.com?subject=' + encodeURIComponent(X[0] + ' (Nebulosa Workspace)') + '&body=' + encodeURIComponent((navigator.userAgent || '') + '\n' + location.href);
    document.body.appendChild(d);
    b.focus();
  }
  window.addEventListener('load', function () { setTimeout(aviso, 1500); });
})();
</script>
