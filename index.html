<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebulosa Workspace</title>
<meta name="description" content="Nebulosa Workspace — suíte de aplicativos web gratuitos, leves e de código aberto que funcionam direto no navegador: Typee, Stardust, LêPraMim, Flyde, Imaginarium, FotoFlow, EmCanto, Paz no Bolso e #pratododia.">
<link rel="icon" type="image/png" href="assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/logo-320.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Jura:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/workspace.css">
<script src="js/theme.js"></script>
</head>
<body data-view="home">
<div id="bgglow"></div>
<div id="shell">
  <nav id="rail" aria-label="Programas do Nebulosa Workspace"></nav>
  <div id="main">
    <header id="top">
      <div id="crumb"><span id="crumbT">Início</span></div>
      <div id="tabs" role="tablist" aria-label="Programas abertos"></div>
      <button class="chip doe-top" id="btnDoeTop" title="Doe com Pix" aria-label="Doe com Pix"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.4-9.2-9.3C1.7 7.4 3.8 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.2 0 5.3 2.9 4.2 6.2C19.5 15.6 12 20 12 20z"/></svg></button>
      <button class="chip sino" id="btnNotif" title="Notificações" aria-label="Notificações"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 003.4 0"/></svg><span class="nbadge" id="nbadge" hidden>0</span></button>
      <button class="chip" id="btnPal" title="Buscar programas e ações (Alt+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="t">Buscar</span><kbd>Alt K</kbd></button>
      <button class="chip prim" id="btnSkin" title="Trocar a aparência do programa que você está usando"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.6-2.2-.4-1.2.3-2.3 1.6-2.3H17a4 4 0 004-4c0-5-4-9.5-9-9.5z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg><span class="t">Aparência</span></button>
      <button class="chip" id="btnFs" title="Tela cheia" aria-label="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </header>
    <section id="stage">
      <div id="home" class="view"></div>
      <div id="apps" class="view" style="pointer-events:none"></div>
    </section>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="pop" id="skinPanel" role="dialog" aria-label="Aparência"></div>
<div class="pop" id="palette" role="dialog" aria-label="Buscar"><div class="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="pq" placeholder="O que você quer fazer? Escrever, apresentar, ler, cozinhar, editar fotos…" autocomplete="off" aria-label="Buscar"></div><div class="plist" id="plist"></div></div>
<div class="pop modal" id="about" role="dialog" aria-label="Sobre"></div>
<div class="pop modal" id="confirm" role="alertdialog" aria-label="Confirmar"></div>
<div class="pop modal doar" id="donate" role="dialog" aria-label="Apoie o Nebulosa Workspace"></div>
<div class="pop modal acessos" id="acessos" role="dialog" aria-label="Acessos"></div>
<div class="pop" id="notifPanel" role="dialog" aria-label="Notificações"></div>
<div id="notifs" role="region" aria-label="Notificações" aria-live="polite"></div>
<div id="toast" role="status"></div>

<noscript><p style="position:fixed;inset:auto 0 0;padding:16px;text-align:center">O Nebulosa Workspace precisa de JavaScript ativado no navegador.</p></noscript>

<!-- Ordem importa: dados (ícones, programas, doação) e módulos (QR, notificações, acessos) antes da lógica do Workspace -->
<script src="js/icons.js"></script>
<script src="js/apps.js"></script>
<script src="js/doacao.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/notificacoes.js"></script>
<script src="js/acessos.js"></script>
<script src="js/workspace.js"></script>
</body>
</html>
