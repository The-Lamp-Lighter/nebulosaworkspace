<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Imaginarium</title>
<meta name="description" content="Imaginarium — editor gráfico offline. Sua criatividade sem limites.">
<link rel="icon" type="image/png" href="assets/icons/icon-64.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<!-- [Nebulosa] ponte com o Nebulosa Workspace (opcional: sem ela o Imaginarium funciona sozinho).
     data-provider: as aparências são do próprio Imaginarium (js/core/skins.js). -->
<script src="../../shared/nebulosa-bridge.js" data-app="imaginarium" data-name="Imaginarium" data-provider></script>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/skin-photopea.css">
<link rel="stylesheet" href="css/skin-nebulosa.css">
</head>
<body class="no-doc">

<div id="app">
  <!-- Barra superior: marca + menus -->
  <header id="menubar">
    <div class="brand" title="Imaginarium — Editor Gráfico">
      <img src="assets/icons/icon-64.png" alt="" width="20" height="20">
      <span>Imaginarium</span>
    </div>
    <nav id="menus" aria-label="Menu principal"></nav>
    <div id="menubar-right">
      <button class="bar-btn" type="button" data-cmd="edit.undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">
        <svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5L3.5 8 7 11.5"/><path d="M3.5 8H12a4.5 4.5 0 010 9H8.500"/></svg>
      </button>
      <button class="bar-btn" type="button" data-cmd="edit.redo" title="Refazer (Ctrl+Y)" aria-label="Refazer">
        <svg class="ico" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4.5L16.5 8 13 11.5"/><path d="M16.5 8H8a4.5 4.5 0 000 9h3.500"/></svg>
      </button>
      <button class="bar-btn text" type="button" data-cmd="help.manual" title="Manual (F1)">Manual</button>
    </div>
  </header>

  <!-- Barra de propriedades dinâmicas da ferramenta -->
  <div id="optionsbar" role="toolbar" aria-label="Opções da ferramenta"></div>

  <div id="main">
    <!-- Ferramentas -->
    <aside id="toolbar" role="toolbar" aria-label="Ferramentas" aria-orientation="vertical"></aside>

    <!-- Área de trabalho -->
    <section id="center">
      <div id="doctabs" role="tablist" aria-label="Documentos abertos"></div>
      <div id="stage">
        <div id="ruler-corner"></div>
        <div class="ruler-wrap h"><canvas id="ruler-h" title="Arraste para criar uma guia horizontal"></canvas><i id="ruler-mark-h"></i></div>
        <div class="ruler-wrap v"><canvas id="ruler-v" title="Arraste para criar uma guia vertical"></canvas><i id="ruler-mark-v"></i></div>
        <div id="viewport"><canvas id="screen"></canvas></div>

        <!-- Tela inicial -->
        <div id="welcome">
          <div class="welcome-inner">
            <div class="welcome-art">
              <img src="assets/icons/logo.png" alt="Imaginarium — Editor Gráfico. Sua criatividade sem limites." width="420" height="420">
            </div>
            <div class="welcome-side">
              <h1>O que vamos criar hoje?</h1>
              <p class="welcome-lead">Tudo roda no seu computador. Nenhum arquivo sai daqui.</p>
              <div class="welcome-actions">
                <button class="btn primary big" type="button" data-cmd="file.new">Novo projeto</button>
                <button class="btn big" type="button" data-cmd="file.open">Abrir imagem</button>
                <button class="btn big" type="button" data-cmd="file.openProject">Abrir projeto .edt</button>
              </div>
              <p class="welcome-drop">Ou arraste imagens e projetos para esta janela.</p>
              <div class="welcome-presets" aria-label="Tamanhos prontos">
                <span class="welcome-label">Começar com um tamanho pronto</span>
                <div class="preset-row">
                  <button class="preset" type="button" data-new="1920x1080"><i style="aspect-ratio:16/9"></i><b>Full HD</b><span>1920 × 1080</span></button>
                  <button class="preset" type="button" data-new="1080x1080"><i style="aspect-ratio:1/1"></i><b>Quadrado</b><span>1080 × 1080</span></button>
                  <button class="preset" type="button" data-new="1080x1920"><i style="aspect-ratio:9/16"></i><b>Story</b><span>1080 × 1920</span></button>
                  <button class="preset" type="button" data-new="2480x3508"><i style="aspect-ratio:210/297"></i><b>A4</b><span>2480 × 3508</span></button>
                </div>
              </div>
              <p class="welcome-foot">Primeira vez por aqui? <button class="link" type="button" data-cmd="help.manual">Abra o manual</button> ou veja os <button class="link" type="button" data-cmd="help.credits">créditos</button>.</p>
            </div>
          </div>
        </div>

        <div id="dropzone"><div>Solte para abrir<br><small>Sobre a imagem: vira uma nova camada · Shift: abre em outra aba</small></div></div>
      </div>
    </section>

    <!-- Painéis -->
    <div id="dock-resizer" title="Arraste para redimensionar · clique duplo para ocultar"></div>
    <aside id="dock" aria-label="Painéis"></aside>
  </div>

  <footer id="statusbar"></footer>
</div>

<div id="overlay-root"></div>
<input type="file" id="file-input" hidden>

<noscript><p style="padding:24px;color:#fff">O Imaginarium precisa de JavaScript ativado no navegador.</p></noscript>

<!-- Scripts clássicos (sem módulos) para funcionar com duplo clique, direto do disco -->

<script src="js/core/kernels-filters.js"></script>

<script src="js/core/effects.js"></script>
<script src="js/core/history-manager.js"></script>
<script src="js/core/layer-manager.js"></script>
<script src="js/core/canvas-engine.js"></script>
<script src="js/core/tool-manager.js"></script>
<script src="js/core/ui-manager.js"></script>
<script src="js/core/image-ops.js"></script>
<script src="js/core/widgets.js"></script>
<script src="js/core/adjustments.js"></script>
<script src="js/core/filters-ui.js"></script>
<script src="js/core/filters-extra.js"></script>
<script src="js/core/liquify.js"></script>
<script src="js/core/shortcuts.js"></script>
<script src="js/core/file-manager.js"></script>

<script src="js/tools/selection-tool.js"></script>

<script src="js/tools/crop-tool.js"></script>

<script src="js/core/vanishing.js"></script>

<script src="js/panels/color-panel.js"></script>
<script src="js/panels/navigator-panel.js"></script>
<script src="js/panels/properties-panel.js"></script>
<script src="js/panels/text-panels.js"></script>
<script src="js/panels/library-panel.js"></script>
<script src="js/panels/layers-panel.js"></script>
<script src="js/panels/layer-style.js"></script>
<script src="js/panels/history-panel.js"></script>
<script src="js/panels/brush-panel.js"></script>
<script src="js/panels/more-panels.js"></script>
<script src="js/panels/adjust-panel.js"></script>

<script src="js/core/skins.js"></script>
<script src="js/app.js"></script>
</body>
</html>
