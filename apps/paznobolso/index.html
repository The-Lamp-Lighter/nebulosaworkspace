<script src="nebulosa-idiomas.js"></script><!-- [Nebulosa] idiomas (0.6): textos em inglês e espanhol -->
<style>
:root{--fs:17px;--bg:#F3F7F5;--sup:#fff;--ink:#22403A;--ink2:#4D6660;--lin:#D5E2DC;--sage:#CFE8DC;--sageD:#2F5D55;--sky:#D6E6F5;--peach:#FAD9C8;--lilac:#E3DAF1;--butter:#FBEFC4;--rose:#F7D6DE;--mint:#CDEDEA;--sand:#EDE3CF;--blue2:#DCE3F3;--gray:#E4EAE7;--neg:#A3423B;--pos:#23664D;--hue:var(--sage)}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Ubuntu","Cantarell","Trebuchet MS","Segoe UI",sans-serif;line-height:1.45}
h1,h2,h3{margin:0;line-height:1.2;font-weight:700}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #6FA6D9;outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--neg)}.pos{color:var(--pos)}
.peq{font-size:.86rem;color:var(--ink2)}
.oculto{display:none!important}
/* ---- casca ---- */
#app{min-height:100vh}
.casca{display:grid;grid-template-columns:15rem 1fr;min-height:100vh}
.lado{background:var(--sup);border-right:1px solid var(--lin);padding:1rem .7rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:.15rem}
.marca{display:flex;align-items:center;gap:.5rem;padding:.2rem .4rem 1rem;font-weight:800;font-size:1.25rem;color:var(--sageD)}
.marca span span{color:#4F8E7B}
.nav{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:none;padding:.5rem .5rem;border-radius:.6rem;cursor:pointer}
.nav i{display:block;width:.65rem;height:1.5rem;border-radius:.25rem;background:var(--c);flex:none;border:1px solid rgba(34,64,58,.18)}
.nav:hover{background:var(--bg)}
.nav.at{background:var(--c);font-weight:700}
.nav.at i{background:var(--sageD)}
.lnk{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit} /* [Nebulosa] 0.5 */
.nav.nbx{font-size:.92em;opacity:.9}.nbgrupo{margin:.8rem .5rem .2rem;font-size:.78em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65}.fechado .nbgrupo{visibility:hidden}.nav.nbx+.rodape{margin-top:.6rem}
.rodape{margin-top:auto;padding:.8rem .4rem 0;font-size:.74rem;color:var(--ink2);line-height:1.3}
.princ{min-width:0}
.topo{position:sticky;top:0;z-index:20;background:var(--hue);border-bottom:1px solid rgba(34,64,58,.2);padding:.6rem 1.2rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.topo h1{margin-right:auto;font-size:1.4rem}
.estado{font-size:.86rem;background:rgba(255,255,255,.75);border-radius:.5rem;padding:.25rem .6rem;max-width:22rem}
.estado.sujo{background:#fff;border:2px solid var(--neg);color:var(--neg);font-weight:700}
.tela{padding:1.1rem 1.2rem 3rem;display:flex;flex-direction:column;gap:1rem}
.casca.fechado{grid-template-columns:3.7rem 1fr}
.fechado .lado{padding:1rem .45rem}
.fechado .lado span,.fechado .rodape{display:none}
.fechado .marca{justify-content:center;padding:.2rem 0 1rem}
.fechado .nav{justify-content:center;padding:.5rem 0}
.nav.mn{color:var(--ink2);font-size:.9rem;margin-bottom:.4rem}
.nav.mn svg{flex:none;width:.9rem}
.itl{display:flex;gap:.3rem;align-items:center;padding:.3rem .6rem;border-top:1px solid var(--lin)}
.itl>span:first-child{flex:1;min-width:9rem}
.itl>span:last-child{white-space:nowrap}

.btn{border:1px solid rgba(34,64,58,.35);background:var(--sup);border-radius:.55rem;padding:.42rem .8rem;cursor:pointer;min-height:2.4rem;display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.btn:hover{background:var(--sage)}
.btn.pri{background:var(--sageD);color:#fff;border-color:var(--sageD);font-weight:700}
.btn.pri:hover{background:#244a43}
.btn.per{border-color:var(--neg);color:var(--neg)}
.btn.per:hover{background:var(--rose)}
.btn.mini{min-height:1.9rem;padding:.15rem .5rem;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:default}
.btn.lig.on{background:var(--butter);border-color:#b79a2e;font-weight:700}
.cx{background:var(--sup);border:1px solid var(--lin);border-radius:.8rem;padding:1rem}
.cx>h2{margin-bottom:.6rem}
.linha{display:flex;gap:.6rem;flex-wrap:wrap;align-items:end}
.duas{display:grid;grid-template-columns:repeat(auto-fit,minmax(24rem,1fr));gap:1rem}
label.cp{display:flex;flex-direction:column;gap:.15rem;font-size:.86rem;color:var(--ink2)}
label.cp>input,label.cp>select,label.cp>textarea,.in{font-size:1rem;color:var(--ink);border:1px solid #9FB6AE;border-radius:.5rem;padding:.4rem .55rem;background:#fff;min-height:2.4rem}
label.ck{display:flex;gap:.5rem;align-items:center;cursor:pointer}
label.ck input{width:1.15rem;height:1.15rem}
.seg{display:inline-flex;border:1px solid rgba(34,64,58,.35);border-radius:.55rem;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:.42rem .75rem;cursor:pointer;min-height:2.4rem;border-right:1px solid var(--lin)}
.seg button:last-child{border-right:0}
.seg button.at{background:var(--sageD);color:#fff;font-weight:700}
.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-weight:700;border-bottom:2px solid var(--lin);padding:.4rem .5rem;font-size:.9rem;color:var(--ink2)}
.tb td{border-bottom:1px solid var(--lin);padding:.4rem .5rem;vertical-align:top}
.tb th.num,.tb td.num{text-align:right}
.tb tr.tot td{font-weight:700;background:var(--bg)}
.tag{display:inline-block;background:var(--rose);border-radius:.4rem;padding:0 .4rem;font-size:.8rem;margin-right:.2rem}
.tag.v{background:var(--sky)}.tag.b{background:var(--butter)}.tag.p{background:var(--lilac)}
.ccx{display:contents}
.vazio{color:var(--ink2);padding:1rem;text-align:center}
.frase{font-size:1.35rem;line-height:1.5}
.frase b{font-size:1.6rem;white-space:nowrap}
.rolar{overflow-x:auto}
.barra{height:.8rem;background:var(--gray);border-radius:.4rem;overflow:hidden;min-width:6rem}
.barra>span{display:block;height:100%;background:#8FC7AE}
.barra.ex>span{background:#E79A8B}
.hb{display:grid;grid-template-columns:minmax(8rem,16rem) 1fr auto auto;gap:.3rem .7rem;align-items:center}
.hb button{all:unset;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb button:hover,.hb button.at{text-decoration:underline;font-weight:700}

.grade{border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:100%}
.grade th,.grade td{padding:.28rem .4rem;border-bottom:1px solid var(--lin);white-space:nowrap;background:var(--sup)}
.grade thead th{position:sticky;top:0;background:var(--butter);z-index:3;text-align:right;border-bottom:2px solid #cdbb6e}
.grade th:first-child,.grade td:first-child{position:sticky;left:0;z-index:2;text-align:left;max-width:15rem;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--lin)}
.grade thead th:first-child{z-index:4}
.grade tr.tp td{background:var(--sageD);color:#fff;font-weight:700}
.grade tr.ct td{background:#EEF5F1;font-weight:700;cursor:pointer}
.grade tr.it td:first-child{padding-left:1.6rem}
.grade tr.it td:first-child button{all:unset;cursor:pointer}
.grade tr.it td:first-child button:hover{text-decoration:underline}
.grade tr.sm td{background:var(--sand);font-weight:700}
.grade tr.sel td{background:var(--butter)}
.grade td.fut{color:#5f7a73;font-style:italic}
.grade td.ac{background:var(--rose)}
.grade td.ab{background:#DDF1E3}
.grade td.cl{cursor:pointer}
.grade td.cl:hover{outline:2px solid #6FA6D9;outline-offset:-2px}
.grade input.ce{width:6.2rem;text-align:right;border:1px solid #9FB6AE;border-radius:.3rem;padding:.15rem .3rem;font-size:.9rem;background:#fffdf3}
.gradeCx{max-height:calc(100vh - 12rem);overflow:auto;border:1px solid var(--lin);border-radius:.6rem;background:var(--sup)}

.inicio{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.inicio .cx{max-width:44rem;width:100%;padding:2rem}
.inicio .nome{font-size:2.6rem;font-weight:800;color:var(--sageD);letter-spacing:-.02em;line-height:1}
.inicio .nome span span{color:#4F8E7B}

.opcoes button{border:1px solid rgba(34,64,58,.3);border-radius:.8rem;padding:1rem;text-align:left;cursor:pointer;background:var(--c);min-height:7rem;display:flex;flex-direction:column;justify-content:flex-start}
.opcoes button b{display:block;font-size:1.1rem;margin-bottom:.3rem}
.opcoes button:hover{border-color:var(--sageD);box-shadow:0 0 0 2px var(--sageD)}
.alerta{background:var(--butter);border:1px solid #cdbb6e;border-radius:.6rem;padding:.7rem .9rem}
.alerta.erro{background:var(--rose);border-color:#cf8f9d}

.fundo{position:fixed;inset:0;background:rgba(34,64,58,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 1rem;z-index:100;overflow:auto}

.modal h2{margin-bottom:.8rem}

#aviso.on{opacity:1}
.chave{font-family:"DejaVu Sans Mono","Consolas",monospace;font-size:1.25rem;letter-spacing:.06em;background:var(--butter);padding:.7rem;border-radius:.5rem;text-align:center;word-break:break-all}

.rel{background:#fff;color:#1b2f2b}

.rel .cab h2{font-size:1.3rem}
.rel .cab .d{margin-left:auto;text-align:right;font-size:.85rem}
.rel h3{margin:1rem 0 .3rem}
.rel table{width:100%;border-collapse:collapse;font-size:.88rem}
.rel th,.rel td{border:1px solid #c7d6d0;padding:.22rem .4rem}
.rel th{background:var(--sage);text-align:left}
.rel tr.ct td{background:#EEF5F1;font-weight:700}
.rel tr.tot td{background:var(--sand);font-weight:700}
.rel .aut{margin-top:1rem;font-size:.72rem;color:#4D6660;border-top:1px solid #c7d6d0;padding-top:.3rem}
.rel.grd table{font-size:.68rem}
.rel.grd td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:24em}
.rel ul{margin:.2rem 0 .2rem 1.1rem;padding:0}
.rel.res table{font-size:.7rem}
.rel.res td:first-child{white-space:nowrap}
.rel.graf svg{max-width:100%!important}
.rel.graf .tb{margin-top:.6rem}
.rel .sug{background:var(--butter);padding:.3rem .5rem;border-radius:.3rem;margin:.2rem 0 .6rem}
.rel .qp{margin-top:1.8rem;padding-top:1rem;border-top:2px dashed #9DB5AD}
.rel .qp::before{content:"Nova página na impressão";display:block;text-align:center;font-size:.72rem;color:#4D6660;margin:-.5rem 0 .8rem}
.manual h3{background:var(--sage);padding:.3rem .5rem;border-radius:.3rem}
#print{display:none}
@media (max-width:860px){.casca{grid-template-columns:1fr}.lado{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.marca{width:100%;padding-bottom:.3rem}.nav{width:auto}.rodape{width:100%;margin-top:.4rem}}
@media print{
  body{background:#fff}
  #app,#modais,#aviso{display:none!important}
  #print{display:block}
  .rel{font-size:10.5pt}
  .rel table{page-break-inside:auto}
  .rel tr{page-break-inside:avoid}
  .rel h3{page-break-after:avoid}
  .rel .qp{break-before:page;page-break-before:always;margin-top:0;padding-top:0;border-top:0}
  .rel .qp::before{display:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

REL.manual = () => cabRel('Manual de uso', 'PazNoBolso: orçamento doméstico') + [
  ['1. O que é', ['O PazNoBolso é um único arquivo (PazNoBolso.html) que abre no navegador, sem instalação e sem internet. Funciona no Chrome, Edge e Firefox, em Windows e Linux.', 'O programa não guarda seus dados dentro dele. Os dados ficam em um arquivo separado, que você abre ao começar e guarda ao terminar.']],
  ['2. Começar', ['Dê dois cliques em PazNoBolso.html. Na tela inicial, escolha: <b>Abrir arquivo de dados</b> (o último que você guardou), <b>Começar novo</b> (em branco, com categorias genéricas) ou <b>Importar planilha</b> (traz sua planilha de orçamento anual).', 'Em computador que não é seu, marque “Estou em um computador de terceiros”. Assim nada fica gravado naquele navegador.']],
  ['3. Guardar os dados', ['Clique em <b>Guardar dados</b> sempre que quiser, e sempre antes de fechar. O programa abre a janela de salvar, para você escolher a pasta e, se quiser, mudar o nome do arquivo. Na primeira vez em cada uso, a janela sugere a pasta Downloads; nas seguintes, a pasta em que você guardou por último. O nome sugerido traz data e hora. O arquivo mais recente é o que vale; os anteriores servem de backup.', 'Enquanto o aviso “Alterações não guardadas” estiver aparecendo, há algo que ainda não foi para o arquivo. Se você fechar assim, o navegador pede confirmação e o programa mantém uma cópia temporária, que é oferecida na próxima abertura e apagada quando você guarda.', 'Se você cancelar a janela de salvar, nada é guardado e o aviso continua. Clique em Guardar dados de novo.', 'A janela de escolha da pasta existe no Chrome e no Edge. O Firefox não a oferece: nele o arquivo vai para a pasta de downloads do navegador. Para o Firefox perguntar o local, marque em Configurações, Geral, Arquivos e aplicativos, a opção “Sempre perguntar onde salvar arquivos”.']],
  ['4. Lançar receitas e despesas', ['Tela <b>Lançamentos</b>: informe data, item, valor e tecle Enter. No campo Item, digite parte do nome e escolha na lista. Se o item não existir, o programa oferece criá-lo.', 'O valor aceita contas, como 10,80+2,50. Em “Mais campos” ficam fornecedor, documento, local, centro de custo e benfeitoria.', 'Para ligar o lançamento a um <b>centro de custo</b>, escolha-o na lista: Imóvel, Viagem ou outro que você tenha criado. Aparece então um campo com o nome do centro escolhido, no qual você seleciona o que já existe ou digita um novo. A opção “Novo centro de custo…” cria outro centro ali mesmo, ao lançar.', 'A lista abaixo tem busca e filtros por mês, categoria e centro de custo. Use Editar e Excluir em cada linha. O botão <b>Desfazer</b>, no topo, volta as últimas alterações.']],
  ['5. Contas que se repetem e parcelas', ['Tela <b>Recorrentes e parcelas</b>. Cadastre uma vez as contas mensais; depois, a cada mês, confira o valor e clique em Lançar, ou lance todas as pendentes de uma vez.', 'Em Parcelamentos, informe o valor da parcela, o total de parcelas e a data da primeira. As parcelas são distribuídas pelos meses e passam para o ano seguinte. Para um parcelamento em andamento, indique a partir de qual parcela lançar.']],
  ['6. Grade anual', ['É a visão dos doze meses lado a lado. Clique em uma categoria para abrir os itens. Os modos são: <b>Visão do ano</b> (realizado nos meses encerrados e previsto nos demais), <b>Realizado</b>, <b>Previsto</b>, <b>Diferença</b> e <b>% do previsto</b>.', 'As cores mostram onde o realizado ficou pior ou melhor que o previsto. Clique no nome do item para ver o gráfico dele.', 'Clique em uma célula para abrir os lançamentos daquele item e mês. Cada lançamento tem o botão <b>Editar</b>, que abre todos os campos (data, valor, item, descrição, fornecedor, documento, local, centro de custo e benfeitoria), e o botão <b>Excluir</b>. Abaixo da lista você inclui um lançamento novo. Depois de editar, a janela volta para a lista do mês.', 'No modo Previsto, digite diretamente nas células.']],
  ['7. Painel e acompanhamento', ['O <b>Painel</b> resume o ano com gráficos: receitas e despesas por mês, saldo acumulado, previsto x realizado, totais dos três últimos anos, despesas por categoria do ano e do ano anterior, lado a lado, e receitas por categoria. Cada gráfico tem um botão Imprimir. O <b>Acompanhamento</b> compara previsto e realizado acumulados até o mês escolhido e projeta o fechamento do ano.']],
  ['8. Centros de custo e benfeitorias', ['O centro de custo reúne lançamentos de categorias diferentes em torno de um mesmo assunto. O programa traz <b>Imóvel</b> e <b>Viagem</b>, e você pode criar outros, como Veículo, na tela <b>Centros de custo</b> ou direto no lançamento. Dentro de cada centro ficam os nomes: cada imóvel, cada viagem, cada veículo.', 'A tela <b>Centros de custo</b> mostra, no ano escolhido, as receitas, as despesas e o resultado de cada nome, com o total do centro. Ali você inclui, renomeia e vê os lançamentos. O que já foi usado é arquivado em vez de excluído. Imóvel e Viagem podem ser renomeados e arquivados, mas não excluídos.', 'Cada lançamento novo leva um só centro de custo. Lançamentos antigos que tinham imóvel e viagem ao mesmo tempo continuam com os dois; ao editar um deles, a caixa “Manter também” conserva o segundo.', 'Benfeitorias são o registro de obras com fornecedor e documento, para comprovar o custo do imóvel em uma venda. Elas não somam no orçamento.']],
  ['9. Investimentos', ['Cadastre as aplicações com instituição, titular, datas e valores. Uma vez por mês, atualize os valores e clique em “Registrar os saldos atuais” para formar o histórico do patrimônio. Há também um histórico de compras de dólar com cotação média.']],
  ['10. Cadastros', ['Crie, renomeie, reordene e mova categorias e itens. Renomear não muda o histórico. O que já tem valores é arquivado em vez de excluído.']],
  ['11. Relatórios', ['A tela <b>Relatórios</b> tem modelos prontos em A4: grade anual, grade anual resumida (só categorias), previsto x realizado, percentuais, resultado por centro de custo (com os lançamentos de cada um ou só o resumo), investimentos, benfeitorias por imóvel, análise e sugestões, comparação entre anos e este manual. Na janela de impressão, você pode escolher “Salvar como PDF”.', 'No <b>resultado por centro de custo</b> com os lançamentos, o resumo sai na primeira página e cada nome, como “Imóvel: Casa da praia”, começa em uma página nova, com o cabeçalho repetido. Assim cada um pode ser impresso ou guardado em separado.']],
  ['12. Novo ano', ['Em <b>Ajustes e ajuda</b>, “Abrir novo ano”. O programa propõe o previsto a partir do ano anterior: média mensal ou mesmo mês, item a item, com reajuste geral ou por categoria. Depois, ajuste os valores na Grade anual, modo Previsto.']],
  ['13. Importar e exportar', ['A importação lê a planilha de orçamento anual (tipo, categoria, item e os meses), as abas de detalhe, benfeitorias e investimentos. Antes de gravar, mostra uma conferência; ao final, compara os totais mensais com os da planilha.', 'A exportação para Excel gera lançamentos, previsto e orçamento anual com fórmulas e listas suspensas, sem gráficos. A aba Lançamentos traz as colunas “Centro de custo” e “Nome no centro de custo”. Planilhas exportadas antes desta mudança, com as colunas Imóvel e Viagem, continuam aceitas na importação. O arquivo exportado não tem senha.', '“Gerar cópia vazia” cria um arquivo de dados em branco com o cadastro genérico, para outra pessoa usar.', 'A planilha exportada e a cópia vazia vão direto para a pasta de downloads do navegador, sem a janela de escolha.']],
  ['14. Senha', ['O botão de cadeado, no topo, liga e desliga a senha. Com ela ligada, o arquivo de dados e a cópia temporária são criptografados, a partir do próximo “Guardar dados”.', 'Ao ligar, o programa mostra uma <b>chave de recuperação</b>. Imprima e guarde longe do computador: ela é a única saída se você esquecer a senha. Sem a senha e sem a chave, os dados não podem ser abertos.', 'Arquivos guardados antes de ligar a senha continuam legíveis. Com a senha ligada, o programa bloqueia a tela depois de alguns minutos sem uso.']],
